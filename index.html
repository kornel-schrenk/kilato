<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kilátó</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 0.5rem;
      }
      h1 {
        margin: 0;
        font-size: 1.25rem;
      }
      .lang-switch button {
        min-width: 44px;
        min-height: 44px;
      }
      .lang-switch button[aria-pressed='true'] {
        font-weight: bold;
      }
      .map-area {
        position: relative;
        height: 45vh;
      }
      .map {
        height: 100%;
        /* Leaflet's panes use z-indexes up to 1000. This keeps them from covering the rest of the page. */
        isolation: isolate;
      }
      .my-location {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 1;
        min-height: 44px;
      }
      main {
        padding: 0 0.5rem;
      }
      .intro-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .intro-buttons button,
      .load-error button,
      .show-more {
        min-height: 44px;
      }
      .places {
        margin: 0.5rem 0;
        padding: 0;
        list-style: none;
      }
      .place {
        display: block;
        width: 100%;
        min-height: 44px;
        padding: 0.25rem;
        border: 0;
        border-bottom: 1px solid #ddd;
        background: none;
        color: inherit;
        font: inherit;
        text-align: left;
        overflow-wrap: anywhere;
      }
      .place[aria-current='true'] {
        background: #ffe9a8;
      }
      .place-name {
        display: block;
        font-weight: 600;
      }
      .place-other,
      .place-meta {
        display: block;
        font-size: 0.875rem;
      }
      .place-meta {
        color: #555;
      }
      @media (min-width: 900px) {
        #app {
          display: grid;
          grid-template: auto 1fr / 60% 40%;
          min-height: 100vh;
        }
        header,
        main {
          grid-column: 2;
        }
        .map-area {
          grid-column: 1;
          grid-row: 1 / span 2;
          position: sticky;
          top: 0;
          height: 100vh;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
